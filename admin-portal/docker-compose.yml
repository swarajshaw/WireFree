version: '3.8'

services:
  app:
    build: .
    ports:
      - "6001:6001"
    environment:
      - PORT=6001
      - DATABASE_URL=postgresql://wirefree:password@db:5432/wirefree
      - NEXTAUTH_URL=http://localhost:6001
      - NEXTAUTH_SECRET=your-secret-key-here
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: wirefree
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wirefree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
